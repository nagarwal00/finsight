<!DOCTYPE html>
<html>
<head>
    <title>Login — FinSight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="hero-section">
        <div style="width: 100%; max-width: 420px; padding: 0 20px;">

            <div class="text-center mb-4">
                <span style="font-size: 32px;">💰</span>
                <h1 style="font-size: 22px; font-weight: 700; color: #0f172a; margin-top: 8px;">Welcome back</h1>
                <p class="text-muted">Login to your FinSight account</p>
            </div>

            <div class="auth-card card">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Login →</button>
                </form>
            </div>

            <p class="text-center mt-3 text-muted">
                Don't have an account? <a href="/signup" style="color: #475569; font-weight: 600;">Sign up</a>
            </p>
        </div>
    </div>
</body>
</html>
