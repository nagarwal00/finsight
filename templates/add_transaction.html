<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction — FinSight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">💰 FinSight</span>
        <div>
            <span class="text-white me-3">Hi, {{ user.name }}</span>
            <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 500px;">
        <h3 class="mb-4">➕ Add Transaction</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label>Description</label>
                <input type="text" name="description" class="form-control" 
                       placeholder="e.g. Zomato order, Metro card recharge" required>
            </div>
            <div class="mb-3">
                <label>Amount (₹)</label>
                <input type="number" name="amount" step="0.01" 
                       class="form-control" placeholder="e.g. 250" required>
            </div>
            <div class="mb-3">
                <label>Category</label>
                <select name="category" class="form-select" required>
                    <option value="">-- Select Category --</option>
                    <option value="Food">🍕 Food</option>
                    <option value="Transport">🚌 Transport</option>
                    <option value="Subscriptions">📱 Subscriptions</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Health">💊 Health</option>
                    <option value="Education">📚 Education</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Date</label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Transaction</button>
        </form>
    </div>
</body>
</html>
